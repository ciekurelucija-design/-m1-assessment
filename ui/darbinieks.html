<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iesniegumu saraksts · darbiniekam</title>
  <style>
    :root { --navy: #1D3557; --teal: #2A9D8F; --bg: #F1F3F5; --line: #C9CED6; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); }
    header { background: var(--navy); color: #fff; padding: 16px; }
    header h1 { margin: 0; font-size: 1.25rem; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
    label { display: block; font-weight: 600; }
    input, select { padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; margin-top: 4px; }
    button { padding: 9px 18px; font: inherit; font-weight: 600; color: #fff; background: var(--teal); border: 0; border-radius: 6px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; background: #fff; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { background: #e8ecf1; }
    .count { margin-top: 12px; color: #444; }
    button.secondary { color: var(--navy); background: #fff; border: 1px solid var(--line); }
    .withdraw-form textarea { width: 100%; min-height: 64px; padding: 8px; font: inherit; border: 1px solid var(--line); border-radius: 6px; margin: 4px 0 8px; }
    .withdraw-form .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .notice { padding: 10px; border-radius: 6px; margin-top: 8px; }
    .notice.error { background: #fdece7; border: 1px solid #e76f51; }
    .notice.ok { background: #e6f4f2; border: 1px solid var(--teal); }
  </style>
</head>
<body>
  <header><h1>Ezermalas novada pašvaldība · Iesniegumu saraksts</h1></header>
  <main>
    <form class="filters" id="filters">
      <div>
        <label for="status">Statuss</label>
        <select id="status" name="status">
          <option value="">Visi</option>
          <option value="RECEIVED">Saņemts</option>
          <option value="IN_PROGRESS">Izskatīšanā</option>
          <option value="FORWARDED">Pārsūtīts</option>
          <option value="ANSWERED">Atbildēts</option>
          <option value="WITHDRAWN">Atsaukts</option>
        </select>
      </div>
      <div>
        <label for="topic">Tēma</label>
        <select id="topic" name="topic">
          <option value="">Visas</option>
          <option value="ROADS">Ceļi un ielas</option>
          <option value="WASTE">Atkritumi</option>
          <option value="PLANNING">Teritorijas plānošana</option>
          <option value="PARKS">Parki un skvēri</option>
          <option value="OTHER">Cits</option>
        </select>
      </div>
      <button type="submit">Meklēt</button>
    </form>
    <div class="count" id="count"></div>
    <div id="notice" aria-live="polite"></div>
    <table>
      <thead>
        <tr><th>Numurs</th><th>Statuss</th><th>Tēma</th><th>Saņemts</th><th>Termiņš</th><th>Kanāls</th><th>Darbība</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <script>
    const rows = document.getElementById("rows");
    const count = document.getElementById("count");
    const notice = document.getElementById("notice");
    const COLUMNS = 7;
    const STATUS_TEXT = {
      RECEIVED: "Saņemts",
      IN_PROGRESS: "Izskatīšanā",
      FORWARDED: "Pārsūtīts",
      ANSWERED: "Atbildēts",
      WITHDRAWN: "Atsaukts",
    };
    const ISSUE_TEXT = {
      REQUIRED: "obligāts lauks",
      INVALID_FORMAT: "nederīga vērtība",
      TOO_LONG: "pārāk garš",
    };

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text == null ? "" : text;
      return td;
    }

    function showNotice(kind, lines) {
      notice.className = "notice " + kind;
      notice.innerHTML = "";
      lines.forEach((line, i) => {
        if (i) notice.appendChild(document.createElement("br"));
        notice.appendChild(document.createTextNode(line));
      });
    }

    // Validāciju dara API. Forma tikai parāda API atbildi.
    function apiErrorLines(status, body) {
      const error = (body && body.error) || {};
      const lines = [`Neizdevās atsaukt (HTTP ${status}${error.code ? ", " + error.code : ""})`];
      if (error.message) lines.push(error.message);
      (error.details || []).forEach((d) => {
        lines.push(`${d.field}: ${ISSUE_TEXT[d.issue] || d.issue}`);
      });
      return lines;
    }

    function openWithdrawForm(tr, id) {
      const existing = tr.nextElementSibling;
      if (existing && existing.classList.contains("withdraw-row")) {
        existing.remove();
        return;
      }
      const formRow = document.createElement("tr");
      formRow.className = "withdraw-row";
      const td = document.createElement("td");
      td.colSpan = COLUMNS;
      const form = document.createElement("form");
      form.className = "withdraw-form";
      const label = document.createElement("label");
      label.textContent = `Atsaukšanas iemesls (${id})`;
      label.htmlFor = "reason-" + id;
      const reason = document.createElement("textarea");
      reason.id = "reason-" + id;
      const actions = document.createElement("div");
      actions.className = "actions";
      const submit = document.createElement("button");
      submit.type = "submit";
      submit.textContent = "Apstiprināt atsaukšanu";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "secondary";
      cancel.textContent = "Atcelt";
      cancel.addEventListener("click", () => formRow.remove());
      actions.append(submit, cancel);
      form.append(label, reason, actions);
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        withdraw(id, reason.value, submit);
      });
      td.appendChild(form);
      formRow.appendChild(td);
      tr.after(formRow);
      reason.focus();
    }

    async function withdraw(id, reason, submit) {
      submit.disabled = true;
      try {
        const response = await fetch(`/submissions/${encodeURIComponent(id)}/withdraw`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          // Tukšu iemeslu nesūtām: API pats pasaka, ka tas trūkst.
          body: JSON.stringify(reason === "" ? {} : { reason }),
        });
        let body = null;
        try { body = await response.json(); } catch (e) { /* nav JSON */ }
        if (response.status === 200) {
          await load();
          showNotice("ok", [`Iesniegums ${id} atsaukts. Statuss: ${STATUS_TEXT[body.status] || body.status}`]);
        } else {
          showNotice("error", apiErrorLines(response.status, body));
        }
      } catch (error) {
        showNotice("error", ["Neizdevās sazināties ar serveri."]);
      } finally {
        submit.disabled = false;
      }
    }

    async function load(event) {
      if (event) {
        event.preventDefault();
        notice.className = "";
        notice.textContent = "";
      }
      const params = new URLSearchParams();
      const status = document.getElementById("status").value;
      const topic = document.getElementById("topic").value;
      if (status) params.set("status", status);
      if (topic) params.set("topic", topic);
      const response = await fetch("/submissions?" + params.toString());
      const data = await response.json();
      rows.innerHTML = "";
      if (!Array.isArray(data)) {
        count.textContent = "Kļūda: " + JSON.stringify(data);
        return;
      }
      count.textContent = "Atrasti: " + data.length;
      for (const s of data) {
        const tr = document.createElement("tr");
        [s.id, STATUS_TEXT[s.status] || s.status, s.topic, s.receivedAt.slice(0, 10), s.dueDate, s.replyChannel]
          .forEach((value) => tr.appendChild(cell(value)));
        const action = document.createElement("td");
        // Atsauktam iesniegumam pogu nerāda. Pārējos noteikumus pārbauda API.
        if (s.status !== "WITHDRAWN") {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "secondary";
          button.textContent = "Atsaukt";
          button.addEventListener("click", () => openWithdrawForm(tr, s.id));
          action.appendChild(button);
        }
        tr.appendChild(action);
        rows.appendChild(tr);
      }
    }

    document.getElementById("filters").addEventListener("submit", load);
    load();
  </script>
</body>
</html>
